---

server:
  name: kibana
  host: 0.0.0.0

monitoring:
  ui:
   container:
    elasticsearch:
     enabled: true

elasticsearch:
  hosts: [ "http://elasticsearch:9200" ]
  username: "kibana_system"
  # Password is injected via the ELASTICSEARCH_PASSWORD environment variable
  # in docker-compose.yml (see .env.example)

xpack:
  encryptedSavedObjects:
    encryptionKey: 'encryption_key_for_elastic_stack_security'
